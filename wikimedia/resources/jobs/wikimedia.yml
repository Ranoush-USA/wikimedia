resources:
  jobs:
    WIKIMEDIA:
      name: WIKIMEDIA
      email_notifications:
        on_success:
          - rana@ghazzi.com
        on_failure:
          - rana@ghazzi.com
      tasks:
        - task_key: wikimedia_bronze
          notebook_task:
            notebook_path: ../notebooks/wikimedia_bronze.ipynb
            source: WORKSPACE

        - task_key: Silver_CDC_Merge
          depends_on:
            - task_key: wikimedia_bronze
          notebook_task:
            notebook_path: ../notebooks/wikimedia_silver.ipynb
            source: WORKSPACE
      queue: {}
      performance_target: PERFORMANCE_OPTIMIZED
      trigger:
        file_arrival:
          url: /Volumes/workspace/bronze/landing_zone/wikimedia/
        pause_status: UNPAUSED
